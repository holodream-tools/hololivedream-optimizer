    <noscript>
      <main>
        <h1>hololive Dreams 隊伍最佳化</h1>
        <p>
          hololive Dreams 非官方隊伍最佳化工具。輸入你持有的卡片與命座，
          它會從所有五人組合中找出綜合推薦指數最高的隊伍，並依實際歌曲譜面
          計算指定歌曲的理論預估分（Perfect 假設）。
        </p>
        <p>
          <strong>這個網站需要 JavaScript 才能使用。</strong>
          所有計算都在你的瀏覽器裡完成，沒有伺服器、不需註冊，
          卡片庫存只留在這台裝置，不會上傳。
        </p>
        <h2>主要功能</h2>
        <ul>
          <li><strong>我的卡片</strong>：勾選持有的卡、設定命座、開啟隊長服裝。</li>
          <li><strong>隊伍最佳化</strong>：把所有五人組合 × 所有隊長服裝算過一遍，依綜合推薦指數排名。</li>
          <li><strong>歌曲／順序</strong>：用實際譜面計算指定歌曲的預估分，試過全部 120 種站位，並畫出技能時間軸。</li>
          <li><strong>隊伍比較</strong>：兩隊 A / B 並排逐項對照，並把總差距拆解成各項貢獻。</li>
          <li><strong>卡片庫</strong>：查各命座下的能力值與技能敘述。</li>
        </ul>
